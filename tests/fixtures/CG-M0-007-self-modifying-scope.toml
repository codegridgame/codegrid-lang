schema_version = 1
id = "CG-M0-007"
status = "protocol-only"
spec_sections = ["13.15", "15.1", "15.2", "15.3", "15.4", "32"]
purpose = "Fixes the scope and lifetime of outer runtime-code changes and invocation-local Custom changes."
distinguishes = "Outer modifications are visible within the current VM; Custom modifications are visible only within that invocation and never write back to static definitions or other invocations."

[program]
format = "abstract-semantics"
text = """scenario {
  outer runtime cell Main(1,0): ADD with WriteCode
  outer InstructionStack: [SUB]
  Custom #0 runtime cell Main(0,0): ADD with WriteCode
  invoke #0 twice from separate outer ticks
}"""

[run]
boundary = "wrap"
seed = 0
custom_execution_limit = 16
max_global_ticks = 8

[expect.v2]
status = "protocol-only"
trace = ["outer WriteCode commits to outer runtime copy", "later outer visit observes SUB", "Custom invocation 1 modifies only its fresh runtime copy", "Custom invocation 2 starts from static Custom definition and observes ADD", "static definitions remain unchanged"]
errors = []
metrics = ["WriteCode counted per execution", "Used Cells deduplicated by static location"]
