schema_version = 1
id = "CG-M0-003"
status = "protocol-only"
spec_sections = ["6.6", "14.1", "14.2", "14.8"]
purpose = "Fixes Repeat's total execution count and cross-tick behavior."
distinguishes = "In v2, + x3 executes three times over three ticks; three ADDs cannot execute in one tick."

[program]
format = "source-format-draft"
text = """codegrid 2
program {
  boundary exit
  board Main size 2 1 {
    initial 0 0 right
    row 0: [+ x3] [;]
  }
}"""

[run]
boundary = "exit"
seed = 0
custom_execution_limit = 32
max_global_ticks = 4

[expect.v2]
status = "halted"
committed_global_ticks = 4
trace = ["t1 ADD#1 at (0,0), stay", "t2 ADD#2 at (0,0), stay", "t3 ADD#3 at (0,0), move to (1,0)", "t4 HALT at (1,0)"]
final_registers = [3, 0, 0, 0, 0, 0, 0, 0, 0, 0]
errors = []
metrics = ["ADD operations=3", "Repeat operations=0"]
