<!doctype html><html><head><meta charset="utf-8"><title>Level Browser Worker Smoke</title></head><body><pre id="result">Running browser worker</pre><script type="module">
const profile=await(await fetch('/fixtures/levels/profiles/local-v1.json')).text();
const fixture={level:await(await fetch('/fixtures/levels/echo.json')).text(),source:await(await fetch('/fixtures/levels/echo.cg')).text()};
const manifest=await(await fetch('/fixtures/levels/conformance-v1.json')).json();
const cases=await Promise.all(manifest.cases.map(async f=>({...f,level_json:await(await fetch('/fixtures/levels/'+f.level)).text(),source:await(await fetch('/fixtures/levels/'+f.program)).text()})));
const worker=new Worker('./worker.mjs',{type:'module'});
worker.onmessage=({data})=>{document.body.dataset.result=data.passed?'passed':'failed';document.getElementById('result').textContent=JSON.stringify(data);fetch('/report',{method:'POST',body:JSON.stringify(data)});worker.terminate();};
worker.onerror=event=>{document.body.dataset.result='failed';document.getElementById('result').textContent=event.message;};
worker.postMessage({profile,fixture,cases});
</script></body></html>
